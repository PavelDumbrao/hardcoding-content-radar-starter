name: validate

on:
  push:
  pull_request:

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Проверка структуры, секретов и синтаксиса
        run: python scripts/validate_project.py
