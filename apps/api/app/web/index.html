<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Radar AI</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --border: #262b38;
      --text: #e8eaf0;
      --muted: #9aa3b5;
      --accent: #4f8cff;
      --ok: #35c37d;
      --warn: #e0a33e;
      --err: #e35d6a;
      --code-bg: #0d1017;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 { font-size: 17px; margin: 0; font-weight: 600; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.on { color: var(--ok); border-color: rgba(53,195,125,.4); }
    .badge.off { color: var(--warn); border-color: rgba(224,163,62,.4); }
    main { flex: 1; overflow-y: auto; padding: 24px; }
    .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border); }
    .msg.user {
      background: #1d2330; align-self: flex-end; max-width: 90%;
      white-space: pre-wrap; margin: 0;
    }
    .msg.ai { background: var(--panel); }

    /* --- Типографика ответа агента (Markdown) --- */
    .answer > *:first-child { margin-top: 0; }
    .answer > *:last-child { margin-bottom: 0; }
    .answer p { margin: 0 0 12px; }
    .answer h2, .answer h3, .answer h4 {
      margin: 24px 0 8px; line-height: 1.3; font-weight: 600; color: #fff;
    }
    .answer h2 { font-size: 20px; }
    .answer h3 { font-size: 17px; }
    .answer h4 { font-size: 16px; }
    .answer ul, .answer ol { margin: 0 0 12px; padding-left: 24px; }
    .answer li { margin: 4px 0; }
    .answer li::marker { color: var(--muted); }
    .answer strong { font-weight: 600; color: #fff; }
    .answer a {
      color: var(--accent); text-decoration: none;
      border-bottom: 1px solid rgba(79,140,255,.35);
    }
    .answer a:hover { border-bottom-color: var(--accent); }
    .answer code {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 1px 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px; white-space: nowrap;
    }
    .answer pre {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; overflow-x: auto; margin: 0 0 12px;
    }
    .answer pre code { background: none; border: none; padding: 0; font-size: 14px; }
    .answer blockquote {
      margin: 0 0 12px; padding: 4px 0 4px 12px;
      border-left: 3px solid var(--accent); color: var(--muted);
    }
    .answer hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .table-wrap { overflow-x: auto; margin: 0 0 12px; }
    .answer table { border-collapse: collapse; width: 100%; margin: 0; font-size: 14px; }
    .answer th, .answer td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .answer th { background: #141822; color: var(--muted); font-weight: 600; }
    .hint { color: var(--muted); font-size: 13px; }
    .error {
      color: var(--err); border-left: 3px solid var(--err);
      padding: 8px 0 8px 12px; white-space: pre-wrap;
    }
    .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(154,163,181,.3); border-top-color: var(--accent);
      animation: spin .8s linear infinite; flex: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    .actions { margin-top: 12px; }
    .copy {
      font-size: 12px; border: 1px solid var(--border); background: transparent;
      color: var(--muted); border-radius: 8px; padding: 5px 11px; cursor: pointer;
    }
    .copy:hover { color: var(--text); border-color: var(--accent); }
    details {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      background: #141822; margin-top: 12px;
    }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    summary:hover { color: var(--text); }
    .kv { display: flex; gap: 10px; font-size: 13px; padding: 4px 0; align-items: baseline; }
    .kv b { color: var(--muted); font-weight: 500; min-width: 132px; flex: none; }
    .status-ok { color: var(--ok); }
    .status-error { color: var(--err); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .chip {
      font-size: 13px; border: 1px solid var(--border); background: transparent;
      color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    footer { border-top: 1px solid var(--border); padding: 16px 24px; }
    form { max-width: 880px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 12px 14px;
      border-radius: 10px; border: 1px solid var(--border); background: #141822;
      color: var(--text); font: inherit; line-height: 1.5;
    }
    textarea:focus-visible, button:focus-visible, .chip:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    button[type=submit] {
      padding: 12px 22px; border-radius: 10px; border: 1px solid var(--accent);
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button[type=submit]:disabled { opacity: .5; cursor: default; }
    @media (max-width: 640px) {
      main { padding: 16px; }
      header, footer { padding-left: 16px; padding-right: 16px; }
      /* Бейджи источников переносим в отдельную строку и разрешаем им переноситься:
         иначе третий бейдж уезжает за край экрана. */
      .badges { margin-left: 0; width: 100%; }
      form { flex-direction: column; align-items: stretch; }
      button[type=submit] { padding: 12px; }
      .msg { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Content Radar AI</h1>
    <span class="hint">контент-разведка: YouTube · VK · Instagram</span>
    <div class="badges" id="badges"></div>
  </header>

  <main id="log">
    <div class="wrap" id="messages">
      <div class="msg ai">Здравствуйте. Спросите, что сейчас залетает в нужной нише — например: «Найди, что растёт в вайб-кодинге за последние 14 дней, покажи лучшие механики и разбери комментарии».<div class="chips" id="presets"></div></div>
    </div>
  </main>

  <footer>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Например: что мне снять про AI-агентов на этой неделе?" required></textarea>
      <button type="submit" id="send">Отправить</button>
    </form>
  </footer>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
